[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sayou"
version = "0.1.0"
description = "The persistent workspace for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.17.0",
    "alembic>=1.13.0",
    "aioboto3>=12.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "moto[s3]>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
sayou = "sayou.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: smoke tests against real RDS + S3 (SAYOU_SMOKE=1)"]

[tool.ruff]
target-version = "py311"
line-length = 100
